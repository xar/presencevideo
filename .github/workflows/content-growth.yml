name: Content Growth

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  content-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Prepare Google credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-credentials.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-credentials.json" >> "$GITHUB_ENV"
          fi

      - name: Run content growth agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GSC_ACCESS_TOKEN: ${{ secrets.GSC_ACCESS_TOKEN }}
          PARALLEL_API_KEY: ${{ secrets.PARALLEL_API_KEY }}
          PARALLEL_API_BASE: ${{ secrets.PARALLEL_API_BASE }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: pi -p "/content-growth-ci"

      - name: Format PHP changes
        run: vendor/bin/pint --dirty --format agent

      - name: Test SEO pages
        run: php artisan test --compact tests/Feature/SeoPagesTest.php

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR body
        if: steps.changes.outputs.changed == 'true'
        run: |
          {
            echo "Automated content-growth run."
            echo
            if [ -f .ai/last-pr-summary.md ]; then
              cat .ai/last-pr-summary.md
            else
              echo "No .ai/last-pr-summary.md was generated. Please review all changes carefully."
            fi
            echo
            echo "## Reviewer checklist"
            echo "- [ ] Content matches brand voice"
            echo "- [ ] Claims are supported by sources/references"
            echo "- [ ] SEO target and search intent make sense"
            echo "- [ ] Internal links are relevant"
            echo "- [ ] .ai/growth-log.md accurately describes the run"
          } > /tmp/content-growth-pr-body.md

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: content-growth/daily-${{ github.run_id }}
          title: "Content growth update"
          body-path: /tmp/content-growth-pr-body.md
          commit-message: "Run automated content growth"
          labels: |
            content
            seo
            automated
