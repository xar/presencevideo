[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=info

; =============================================================================
; PHP-FPM Process
; =============================================================================
[program:php-fpm]
command=/usr/sbin/php-fpm8.5 --nodaemonize --fpm-config /etc/php/8.5/fpm/php-fpm.conf
user=root
autostart=true
autorestart=true
startsecs=5
startretries=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; =============================================================================
; Inertia SSR Server
; =============================================================================
[program:inertia-ssr]
command=php artisan inertia:start-ssr
user=www
directory=/var/www/html
autostart=true
autorestart=true
startsecs=5
startretries=3
priority=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; =============================================================================
; Caddy Web Server
; =============================================================================
[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
user=root
directory=/var/www/html
autostart=true
autorestart=true
startsecs=2
startretries=3
; Lower priority number = starts first, so PHP-FPM (10) starts before Caddy (20)
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; =============================================================================
; Queue Worker
;
; The app container runs its own worker so a single-container deploy (one
; Coolify service built from the Dockerfile) actually processes jobs. Nothing
; picked jobs up at all while this was missing: renders, generations and chat
; were dispatched and then sat in Redis forever, with no error to read.
;
; Set RUN_QUEUE=false when a SEPARATE CONTAINER_MODE=queue container exists, so
; the two do not compete for the same reservations.
; =============================================================================
[program:queue]
command=/usr/local/bin/services.sh queue
user=www
directory=/var/www/html
autostart=%(ENV_RUN_QUEUE)s
autorestart=true
; queue:work exits cleanly on --max-jobs / --memory; that is a restart, not a crash.
exitcodes=0
startsecs=5
startretries=3
priority=30
stopwaitsecs=910
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; =============================================================================
; Task Scheduler
;
; Load-bearing for chat, not just for renders: agent:sweep-invocations is the
; only thing that unsticks a client whose worker was killed mid-run.
; =============================================================================
[program:scheduler]
command=/usr/local/bin/services.sh scheduler
user=www
directory=/var/www/html
autostart=%(ENV_RUN_SCHEDULER)s
autorestart=true
startsecs=5
startretries=3
priority=35
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; =============================================================================
; Reverb WebSocket Server (port 8080)
;
; Chat degrades to reconcile-only polling without it -- slower, never lossy,
; because agent_invocations is the source of truth, not the socket.
; =============================================================================
[program:reverb]
command=/usr/local/bin/services.sh reverb
user=www
directory=/var/www/html
autostart=%(ENV_RUN_REVERB)s
autorestart=true
startsecs=5
startretries=3
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
