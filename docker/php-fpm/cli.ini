[PHP]
; =============================================================================
; PHP CLI overrides
; =============================================================================
;
; Loaded AFTER 99-production.ini (conf.d is read alphabetically), so this file
; undoes the web-tuned settings that are actively harmful to a long-running
; worker.
;
; The queue worker, the scheduler and Reverb all run as PID 1 and their only
; window into what they are doing is the container's stdout. The shared php.ini
; sets `output_buffering = 4096` with `implicit_flush = Off` for FPM, which on a
; worker means log lines sit in a 4KB buffer until it happens to fill -- minutes
; late, or never for a quiet queue. That is not a missing log, it is a withheld
; one, and it makes a stuck job indistinguishable from an idle worker.
;
; The CLI SAPI defaults to unbuffered for exactly this reason; an explicit
; directive in conf.d overrides that default, so it has to be set back here.
; =============================================================================

output_buffering = Off
implicit_flush = On

; A render or a long agent run legitimately outlives the web limit. The queue
; worker's own --timeout is the real bound on job length (see the retry_after /
; timeout relationship pinned in the render pipeline tests), so the CLI must not
; impose a shorter one underneath it.
max_execution_time = 0
